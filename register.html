<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Register Account</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🎓 StudentHub</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" class="active">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="card" style="max-width: 500px; margin: 2rem auto;">
            <span class="wireframe-badge">Low-Fidelity Blueprint Page 3/11</span>
            <h2>Create Account</h2>
            <form style="margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;" placeholder="Daksh Patel">
                </div>
                <div>
                    <label for="regno">Student ID / Roll No</label>
                    <input type="text" id="regno" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;" placeholder="25CS102">
                </div>
                <div>
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <div>
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <button type="button" class="btn">Register</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal</p>
    </footer>
</body>
</html>
