<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🎓 StudentHub</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="card" style="max-width: 450px; margin: 3rem auto;">
            <span class="wireframe-badge">Low-Fidelity Blueprint Page 2/11</span>
            <h2>Sign In to StudentHub</h2>
            <form style="margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label>Select Role:</label><br>
                    <input type="radio" id="student" name="role" checked> <label for="student">Student</label> &nbsp;
                    <input type="radio" id="faculty" name="role"> <label for="faculty">Faculty</label> &nbsp;
                    <input type="radio" id="admin" name="role"> <label for="admin">Admin</label>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;" placeholder="student@charusat.edu.in">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <button type="button" class="btn">Sign In</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.9rem;">New User? <a href="register.html">Create an Account</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal</p>
    </footer>
</body>
</html>
