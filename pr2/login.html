<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to StudentHub Portal with Student, Faculty, or Admin credentials.">
    <title>StudentHub | Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header dynamically rendered by layout.js -->
    <header></header>

    <div class="container" style="margin-bottom: 0; margin-top: 1rem; padding-top: 10px; padding-bottom: 10px;">
        <nav aria-label="Breadcrumb" class="breadcrumb-nav" style="margin-bottom: 0;">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item" aria-current="page">Login</li>
            </ol>
        </nav>
    </div>

    <main id="main-content" class="container" tabindex="-1">
        <section aria-labelledby="login-heading" class="card" style="max-width: 480px; margin: 1rem auto;">
            <span class="wireframe-badge">Institutional Login</span>
            <h1 id="login-heading" style="font-size: 1.8rem; margin-top: 0.5rem;">Sign In to StudentHub</h1>

            <form action="dashboard.html" method="GET" style="margin-top: 1.5rem;">
                <fieldset>
                    <legend>Select User Role</legend>
                    <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
                        <label for="role-student" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                            <input type="radio" id="role-student" name="role" value="student" checked> 🎓 Student
                        </label>
                        <label for="role-faculty" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                            <input type="radio" id="role-faculty" name="role" value="faculty"> 👨‍🏫 Faculty
                        </label>
                        <label for="role-admin" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                            <input type="radio" id="role-admin" name="role" value="admin"> 🔑 Admin
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="login-email">Email Address <span style="color: var(--danger-color);">*</span></label>
                    <input type="email" id="login-email" name="email" class="form-control" placeholder="25cs102@charusat.edu.in" required aria-required="true" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="login-password">Password <span style="color: var(--danger-color);">*</span></label>
                    <input type="password" id="login-password" name="password" class="form-control" required aria-required="true" autocomplete="current-password">
                </div>

                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.95rem; text-align: center; color: var(--text-color);">
                New User? <a href="register.html" style="color: var(--primary-color);">Create an Account</a>
            </p>
        </section>
    </main>

    <!-- Footer dynamically rendered by layout.js -->
    <footer></footer>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
